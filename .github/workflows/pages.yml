name: Deploy to GitHub Pages

# Gives the game a plain https:// URL that installs to a phone home screen.
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Icons are committed, but regenerating proves the generator still matches them.
      - name: Regenerate icons
        run: node tools/make-icons.mjs

      - name: Fail if committed icons are stale
        run: git diff --exit-code -- icons

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
